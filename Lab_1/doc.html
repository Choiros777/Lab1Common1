<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Документация проекта"
  >

  <title>Документация</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    :root {
      color-scheme: dark;

      --background: #0f172a;
      --background-light: #172554;
      --surface: rgba(15, 23, 42, 0.82);
      --surface-light: rgba(30, 41, 59, 0.78);
      --border: rgba(148, 163, 184, 0.2);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --heading: #f8fafc;
      --accent: #93c5fd;
      --accent-strong: #60a5fa;
      --code-background: #020617;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(59, 130, 246, 0.22),
          transparent 30rem
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(124, 58, 237, 0.2),
          transparent 28rem
        ),
        linear-gradient(135deg, var(--background), var(--background-light));
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 6vw, 72px);
      border: 1px solid var(--border);
      border-radius: 30px;
      background:
        linear-gradient(
          135deg,
          rgba(30, 64, 175, 0.7),
          rgba(15, 23, 42, 0.78)
        ),
        var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero::before {
      position: absolute;
      top: -100px;
      right: -80px;
      width: 280px;
      height: 280px;
      content: "";
      border: 1px solid rgba(147, 197, 253, 0.2);
      border-radius: 50%;
      box-shadow:
        0 0 0 24px rgba(147, 197, 253, 0.04),
        0 0 0 48px rgba(147, 197, 253, 0.03);
      transform: rotate(20deg);
    }

    .eyebrow {
      position: relative;
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 0;
      color: var(--heading);
      font-size: clamp(2.6rem, 8vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .subtitle {
      position: relative;
      max-width: 650px;
      margin: 26px 0 0;
      color: #cbd5e1;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 24px;
      align-items: start;
      margin-top: 24px;
    }

    .document,
    .sidebar {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .document {
      min-width: 0;
      padding: clamp(24px, 5vw, 56px);
    }

    .sidebar {
      position: sticky;
      top: 24px;
      padding: 22px;
    }

    .sidebar-title {
      margin: 0 0 14px;
      color: var(--heading);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toc {
      display: grid;
      gap: 8px;
    }

    .toc a {
      overflow: hidden;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 10px;
      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .toc a:hover {
      color: var(--heading);
      background: var(--surface-light);
    }

    .status {
      margin-top: 18px;
      padding-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      border-top: 1px solid var(--border);
    }

    .markdown {
      color: var(--text);
      font-size: 1.02rem;
      line-height: 1.8;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3,
    .markdown h4 {
      margin: 1.8em 0 0.7em;
      color: var(--heading);
      line-height: 1.25;
      letter-spacing: -0.035em;
    }

    .markdown h1 {
      padding-bottom: 0.45em;
      font-size: clamp(2rem, 4vw, 3rem);
      border-bottom: 1px solid var(--border);
    }

    .markdown h2 {
      padding-bottom: 0.35em;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      border-bottom: 1px solid var(--border);
    }

    .markdown h3 {
      font-size: 1.45rem;
    }

    .markdown h4 {
      font-size: 1.15rem;
    }

    .markdown p,
    .markdown ul,
    .markdown ol,
    .markdown blockquote,
    .markdown table,
    .markdown pre {
      margin: 1.1em 0;
    }

    .markdown a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(147, 197, 253, 0.35);
    }

    .markdown a:hover {
      color: #bfdbfe;
      border-color: currentColor;
    }

    .markdown ul,
    .markdown ol {
      padding-left: 1.5em;
    }

    .markdown li + li {
      margin-top: 0.4em;
    }

    .markdown blockquote {
      padding: 12px 18px;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.62);
      border-left: 4px solid var(--accent-strong);
      border-radius: 0 12px 12px 0;
    }

    .markdown code {
      padding: 0.18em 0.42em;
      color: #bfdbfe;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.88em;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 6px;
    }

    .markdown pre {
      overflow-x: auto;
      padding: 18px;
      color: #dbeafe;
      font-size: 0.9rem;
      line-height: 1.65;
      background: var(--code-background);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .markdown pre code {
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
    }

    .markdown img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.2em auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .markdown table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .markdown th,
    .markdown td {
      padding: 10px 14px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .markdown th {
      color: var(--heading);
      background: var(--surface-light);
    }

    .error {
      padding: 22px;
      color: #fecaca;
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 14px;
    }

    .footer {
      padding: 24px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        order: -1;
      }

      .toc {
        display: flex;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .toc a {
        flex: 0 0 auto;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 10px;
      }

      .hero,
      .document,
      .sidebar {
        border-radius: 20px;
      }

      .hero {
        padding: 34px 24px;
      }

      .document {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Наши заметки</p>
      <h1>Документация</h1>
      <p class="subtitle">
        Актуальная документация проекта, загруженная из файла
        <code>README.md</code>.
      </p>
    </header>

    <section class="layout">
      <article class="document">
        <div id="content" class="markdown" aria-live="polite">
          Загрузка документации…
        </div>
      </article>

      <aside class="sidebar">
        <h2 class="sidebar-title">Содержание</h2>
        <nav id="toc" class="toc" aria-label="Содержание документации">
          <span class="status">Загрузка…</span>
        </nav>
        <div class="status">
          Источник: <code>README.md</code>
        </div>
      </aside>
    </section>

    <footer class="footer">
      Документация проекта
    </footer>
  </main>

  <script>
    const content = document.querySelector("#content");
    const toc = document.querySelector("#toc");

    marked.setOptions({
      gfm: true,
      breaks: true
    });

    function createSlug(text, index) {
      const slug = text
        .toLowerCase()
        .trim()
        .replace(/[^\p{L}\p{N}\s-]/gu, "")
        .replace(/\s+/g, "-");

      return slug || `section-${index}`;
    }

    function buildTableOfContents() {
      const headings = [...content.querySelectorAll("h1, h2, h3")];

      if (!headings.length) {
        toc.innerHTML = "<span class=\"status\">Разделы отсутствуют</span>";
        return;
      }

      const usedIds = new Set();

      toc.innerHTML = headings
        .map((heading, index) => {
          const baseId = createSlug(heading.textContent, index);
          let id = baseId;
          let suffix = 2;

          while (usedIds.has(id)) {
            id = `${baseId}-${suffix++}`;
          }

          usedIds.add(id);
          heading.id = id;

          return `
            <a href="#${id}">
              ${heading.textContent}
            </a>
          `;
        })
        .join("");
    }

    async function loadReadme() {
      try {
        const response = await fetch("README.md", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();
        const rendered = marked.parse(markdown);

        content.innerHTML = DOMPurify.sanitize(rendered);
        buildTableOfContents();
      } catch (error) {
        content.innerHTML = `
          <div class="error">
            <strong>Не удалось загрузить README.md</strong>
            <br>
            Проверьте, что файл находится рядом с doc.html
            и сервер разрешает его чтение.
            <br><br>
            Ошибка: ${error.message}
          </div>
        `;

        toc.innerHTML = `
          <span class="status">
            Содержание недоступно
          </span>
        `;
      }
    }

    loadReadme();
  </script>
</body>
</html>
