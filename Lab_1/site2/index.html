<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Второй домен</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-start: #111827;
      --bg-end: #312e81;
      --accent: #a78bfa;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(167, 139, 250, 0.28), transparent 32%),
        radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.2), transparent 30%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      content: "";
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    body::before {
      top: -100px;
      left: -80px;
    }

    body::after {
      right: -100px;
      bottom: -120px;
      width: 360px;
      height: 360px;
      animation-delay: -3s;
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 72px) clamp(24px, 7vw, 64px);
      text-align: center;
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      animation: appear 0.8s ease-out both;
    }

    .icon {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      place-items: center;
      font-size: 34px;
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 460px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .line {
      width: 72px;
      height: 4px;
      margin: 30px auto 0;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      border-radius: 999px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(18px, -16px) rotate(8deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✦</div>

    <h1>Заглушка второго домена</h1>

    <p>
      Этот домен настроен и уже принимает запросы.
      Здесь скоро появится новый сайт.
    </p>

    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
