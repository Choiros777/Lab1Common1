<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Страница не найдена</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: #f8fafc;
      background: linear-gradient(135deg, #111827, #312e81);
    }

    main {
      max-width: 600px;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 1;
      color: #a78bfa;
    }

    h2 {
      margin: 20px 0 12px;
      font-size: 2rem;
    }

    p {
      color: #cbd5e1;
      font-size: 1.1rem;
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Страница не найдена</h2>
    <p>
      Возможно, адрес указан неправильно или страница была перемещена.
    </p>
    <p><a href="/">Вернуться на главную</a></p>
  </main>
</body>
</html>
